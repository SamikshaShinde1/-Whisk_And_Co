<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons are made from logo.png by running: npm run favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pastel n Postery – a home bakery making fresh cakes, cupcakes, breads, cookies and desserts. Preorder online or on WhatsApp." />
    <meta name="theme-color" content="#3b2420" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Link previews on WhatsApp, Instagram, Facebook (Open Graph) and X/Twitter.
         %SITE_URL% is filled in from VITE_SITE_URL by vite.config.js.
         The picture is public/og-image.png (made by: npm run share-image). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pastel n Postery" />
    <meta property="og:title" content="Pastel n Postery | Home Bakery" />
    <meta property="og:description" content="Fresh cakes, cupcakes, breads, cookies and desserts, baked at home. Preorder online or on WhatsApp." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pastel n Postery, home bakery" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pastel n Postery | Home Bakery" />
    <meta name="twitter:description" content="Fresh cakes, cupcakes, breads, cookies and desserts, baked at home. Preorder online or on WhatsApp." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&family=Manrope:wght@400;500;600;700;800&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>Pastel n Postery | Home Bakery</title>
    <script>
      // Choose light or dark BEFORE the page is drawn, so it never flashes white.
      // The same rules are in src/hooks/useTheme.js.
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('pnp-theme')
        } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c110f')
      })()
    </script>
    <style>
      /* the page colour before the CSS file arrives */
      html { background: #fbf4ef; }
      html[data-theme='dark'] { background: #2a1a17; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
