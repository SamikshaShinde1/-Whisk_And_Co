<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons are made from logo.png by running: npm run favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pastel n Postery – a home bakery making fresh cakes, cupcakes, breads, cookies and desserts. Preorder online or on WhatsApp." />
    <meta name="theme-color" content="#2b1a14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>Pastel n Postery | Home Bakery</title>
    <script>
      // Choose light or dark BEFORE the page is drawn, so it never flashes white.
      // The same rules are in src/hooks/useTheme.js.
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('pnp-theme')
        } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#160e0b')
      })()
    </script>
    <style>
      /* the page colour before the CSS file arrives */
      html { background: #f6efe5; }
      html[data-theme='dark'] { background: #241813; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
